<div class="container hero">
  <div class="hero-content">
    <div class="hero-header">
      <div>Nazywam się Iwona Palka</div>
      <div>i jestem certyfikowaną</div>
      <div>psychoterapeutką Gestalt</div>
    </div>

    <div class="hero-subtitle">
      <p>Pracuję we Wrocławiu z osobami dorosłymi, parami</p>
      <p>oraz młodzieżą od 16. roku życia</p>
      <div class="actions-wrapper">
        <app-button type="button"
                    buttonClass="btn action-button"
                    (buttonAction)="goToContact()">
          Skontaktuj się
        </app-button>
        <app-button type="button"
                    buttonClass="btn secondary-button"
                    (buttonAction)="goToAboutGestalt()">
          Więcej o Gestalt
        </app-button>
      </div>
    </div>
  </div>

  <div class="hero-img wrap-center">
    <img
      [ngSrc]="'/assets/images/profile-arc.png'"
      width="600"
      height="640"
      priority
      alt="Profile image">
  </div>
</div>
