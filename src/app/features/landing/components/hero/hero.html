<div class="container">
  <h1>{{ hero.title }}</h1>
  <div class="hero-img wrap-center">
    <img
      [ngSrc]="'assets/images/placeholder-tablet.png'"
      width="600"
      height="640"
      priority
      alt="Hero image">
  </div>
  <p>{{ hero.subtitle }}</p>
</div>

<div class="block-wrapper">
  <app-button type="button" buttonClass="btn action-button">Skontaktuj się</app-button>
  <app-button type="button" buttonClass="btn secondary-button"> Czytaj więcej o Gestalt</app-button>
</div>
